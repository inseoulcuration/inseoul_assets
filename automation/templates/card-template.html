<!doctype html>
<html lang='ko'>
<head>
<meta charset='utf-8'>
<link href='https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&amp;display=swap' rel='stylesheet'>
<style>
:root{--panel:#6e6684;--canvas:#000000;--ink:#ffffff;--ink-body:#f2f0f5;--ink-muted:#d6d2de;--accent:#f0e2c8;--pad:72px}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1350px}
body{background:var(--canvas);display:flex;flex-direction:column;overflow:hidden;position:relative;font-family:'Noto Sans KR',sans-serif}

.photo{flex:1 1 auto;min-height:0;position:relative}
.photo img{width:100%;height:100%;object-fit:cover;display:none}

.photo:after{content:'';position:absolute;left:0;right:0;bottom:0;height:200px;background:linear-gradient(to top,rgba(0,0,0,.55),transparent);z-index:1;pointer-events:none}
.credit{position:absolute;right:30px;bottom:18px;z-index:2;max-width:calc(100% - 60px);text-align:right;font-size:26px;font-weight:400;color:rgba(255,255,255,.8);letter-spacing:.01em;text-shadow:0 1px 4px rgba(0,0,0,.6)}
.src:before{content:' · '}
.src:empty{display:none}
.cap:empty + .src:before{content:''}

.panel{flex:0 0 580px;background:var(--panel);padding:46px var(--pad) 38px;display:flex;flex-direction:column;overflow:hidden}
.eyebrow{display:none;font-size:30px;font-weight:500;color:var(--accent);letter-spacing:.06em;margin-bottom:14px}
.headline{font-size:54px;font-weight:700;color:var(--ink);line-height:1.2;letter-spacing:-.02em;word-break:keep-all;overflow-wrap:anywhere}
.body{font-size:34px;font-weight:400;color:var(--ink-body);line-height:1.45;margin-top:22px;word-break:keep-all;overflow-wrap:anywhere}
.rule{display:none}
.cta{display:none}
.meta{display:flex;justify-content:space-between;align-items:baseline;font-size:26px;color:var(--ink-muted);margin-top:auto;padding-top:30px;font-variant-numeric:tabular-nums}

[data-role='표지'] .ph{display:block}
[data-role='표지'] .panel{flex:0 0 500px;padding-top:58px}
[data-role='표지'] .headline{font-size:56px;line-height:1.2}
[data-role='표지'] .body{font-size:34px;margin-top:26px}

[data-role='본문'] .ph{display:block}
[data-role='본문'] .eyebrow{display:block}

[data-role='클로징']{background:var(--panel)}
[data-role='클로징'] .photo{display:none}
[data-role='클로징'] .panel{flex:1 1 auto;min-height:0;background:transparent;padding:0 var(--pad);justify-content:center;align-items:center;text-align:center}
[data-role='클로징'] .headline{font-size:52px;line-height:1.35}
[data-role='클로징'] .body{font-size:35px;line-height:1.55;margin-top:30px;color:var(--ink-muted)}
[data-role='클로징'] .rule{display:block;width:96px;height:2px;background:var(--ink-muted);opacity:.55;margin:52px 0 30px}
[data-role='클로징'] .cta{display:block;font-size:32px;font-weight:500;color:var(--ink)}
[data-role='클로징'] .meta{position:absolute;left:var(--pad);right:var(--pad);bottom:44px;margin:0}
</style>
</head>
<!--
  이 파일은 원본 Make 카드 템플릿(inseoul_card_template_1.html)을 그대로 보관하는
  참고용 원본입니다. Make 문법({{4.role}}, {{escapeJSON(...)}}, {{get(split(...))}})은
  n8n에는 없으므로 실제 렌더는 n8n-workflows/05-render.json 안의 Code 노드가
  이 CSS/구조를 그대로 품은 JS 함수(buildCardHtml)로 대신합니다.
  디자인을 손볼 때는: 이 파일에서 먼저 눈으로 확인 → 05-render.json의
  Code 노드 안 CSS 문자열에 동일하게 반영하세요.
-->
<body data-role='{{4.role}}'>
<div class='photo'><img class='ph' src='{{get(split(20.photos; ","); 4.no)}}' alt=''><div class='credit'><span class='cap'>{{escapeJSON(4.photo_caption)}}</span><span class='src'>{{escapeJSON(get(split(21.credits; ","); 4.no))}}</span></div></div>
<div class='panel'>
<div class='eyebrow'>{{if(4.no >= 10; 4.no; "0" + 4.no)}} · 리테일</div>
<div class='headline'>{{escapeJSON(4.headline)}}</div>
<div class='body'>{{escapeJSON(4.body)}}</div>
<div class='rule'></div>
<div class='cta'>@inseoul_curation</div>
<div class='meta'><span>서울 · 리테일 · 공간</span><span>{{4.no}}/{{length(3.slides)}}</span></div>
</div>
</body>
</html>
